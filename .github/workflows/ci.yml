# CI on pull requests runs lint, typecheck, and tests, then an optional
# subscription-CLI review (Claude Code or Codex — never API-billed keys).
#
# GitHub Actions secrets (repository → Settings → Secrets and variables → Actions):
# - CLAUDE_CODE_OAUTH_TOKEN — from `claude setup-token` (Claude Pro/Max/Team subscription).
# - CODEX_AUTH_JSON — full contents of ~/.codex/auth.json after `codex login` (ChatGPT subscription).
#   Do not use OPENAI_API_KEY or ANTHROPIC_API_KEY in this workflow.
#
# If neither secret is set, the llm-review job skips with a notice; lint/typecheck/test still gate the PR.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # LayoutProps and next-env.d.ts are generated. next-env.d.ts is gitignored.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Build half of `npm run deploy` / `npm run preview`. No deploy and no secrets.
      - name: Build OpenNext Worker
        run: npx opennextjs-cloudflare build

  select-reviewer:
    name: choose LLM reviewer
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: check
    outputs:
      reviewer: ${{ steps.pick.outputs.reviewer }}
      reason: ${{ steps.pick.outputs.reason }}
      built_by_llm: ${{ steps.pick.outputs.built_by_llm }}
      reviewed_by_tool: ${{ steps.pick.outputs.reviewed_by_tool }}
      reviewed_by_llm: ${{ steps.pick.outputs.reviewed_by_llm }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Select reviewer from PR body and secrets
        id: pick
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: npx tsx .github/scripts/select-llm-reviewer-cli.ts

  llm-review-skipped:
    name: LLM review skipped
    if: >-
      github.event_name == 'pull_request' &&
      (needs.select-reviewer.outputs.reviewer == 'skip' ||
      (needs.select-reviewer.outputs.reviewer != 'skip' &&
      github.event.pull_request.head.repo.full_name != github.repository))
    runs-on: ubuntu-latest
    needs: select-reviewer
    steps:
      - name: Notice
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::notice title=LLM review skipped::Fork pull requests cannot use repository review secrets."
          else
            echo "::notice title=LLM review skipped::${{ needs.select-reviewer.outputs.reason }}"
          fi

  claude-review:
    name: LLM review (Claude Code)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.select-reviewer.outputs.reviewer == 'claude'
    runs-on: ubuntu-latest
    needs: select-reviewer
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: PR review (Claude Code subscription)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Built by LLM (from PR body): ${{ needs.select-reviewer.outputs.built_by_llm }}

            You are the different-model reviewer for this pull request (PROCESS.md).
            Review ONLY the changes introduced by this PR. Consider correctness, security,
            moderation/auth/schema implications for Can't Bleep This, tests, and PRD alignment.

            Post findings on the pull request using inline comments where appropriate and a
            short summary. Note in the summary: Reviewed by model Tool Claude Code.
          claude_args: |
            --permission-mode auto
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  codex-review:
    name: LLM review (Codex)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.select-reviewer.outputs.reviewer == 'codex'
    runs-on: ubuntu-latest
    needs: select-reviewer
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Codex subscription auth
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          mkdir -p "$HOME/.codex"
          printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json"
          chmod 600 "$HOME/.codex/auth.json"

      - name: Run Codex review
        env:
          GITHUB_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          npx --yes @openai/codex@0.162.1 review \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            "Review this pull request for Can't Bleep This. Focus on correctness, security, moderation/auth/schema, tests, and PRD alignment. Built-by LLM is in the PR body; you are the different-model reviewer per PROCESS.md." \
            > codex-review.md 2>&1 || true
          if [[ ! -s codex-review.md ]]; then
            echo "Codex review produced no output." > codex-review.md
          fi

      - name: Post PR review comment
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/post-codex-review.sh codex-review.md
